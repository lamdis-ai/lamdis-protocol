[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lamdis"
version = "0.1.0"
description = "Client for the Lamdis Exchange: pay people for physical work from an agent. No account needed for a first job."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []
keywords = ["lamdis", "agents", "mcp", "physical-work", "exchange"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://exchange.lamdis.ai/docs"
Source = "https://github.com/lamdis-ai/lamdis-protocol/tree/main/sdk/python"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
