[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamdis-openai-agents"
version = "0.1.0"
description = "OpenAI Agents SDK function tools for the Lamdis Exchange: pay people for physical work, sandbox first."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["openai-agents>=0.1", "httpx>=0.24"]

[project.urls]
Homepage = "https://exchange.lamdis.ai"
Source = "https://github.com/lamdis-ai/lamdis-protocol/tree/main/integrations/openai-agents"

[tool.setuptools.packages.find]
include = ["lamdis_openai_agents*"]
