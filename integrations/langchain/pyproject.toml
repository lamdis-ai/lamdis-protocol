[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamdis-langchain"
version = "0.1.0"
description = "LangChain tools for the Lamdis Exchange: pay people for physical work, sandbox first."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["langchain-core>=0.3", "httpx>=0.24"]

[project.urls]
Homepage = "https://exchange.lamdis.ai"
Source = "https://github.com/lamdis-ai/lamdis-protocol/tree/main/integrations/langchain"

[tool.setuptools.packages.find]
include = ["lamdis_langchain*"]
