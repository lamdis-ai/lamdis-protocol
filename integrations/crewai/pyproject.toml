[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamdis-crewai"
version = "0.1.0"
description = "CrewAI tools for the Lamdis Exchange: pay people for physical work, sandbox first."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["crewai>=0.100", "httpx>=0.24", "pydantic>=2"]

[project.urls]
Homepage = "https://exchange.lamdis.ai"
Source = "https://github.com/lamdis-ai/lamdis-protocol/tree/main/integrations/crewai"

[tool.setuptools.packages.find]
include = ["lamdis_crewai*"]
